http-body = "1"
http-body-util = "0.1"
h2 = "0.4"
hmac = "0.13"
hyper = "1"
hyper-util = "0.1"
insta = "1"
jiff = "0.2"
jsonschema = { version = "0.56", default-features = false }
k8s-openapi = "0.28"
kube = { version = "4.2", default-features = false }
libc = "0.2"
log = "0.4"
lru = "0.18"
md-5 = "0.11"
metrics = "0.24.1"
multer = "3"
nix = "0.31"
rustix = "1.1.4"
notify = "8"
oci-spec = { version = "0.10", default-features = false, features = ["distribution"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf"] }
# Default features stay on because 0.3.0 does not build without them, despite
# declaring them optional: `src/hooks/logging.rs` imports `log` unconditionally
# and `src/provider/mod.rs` re-exports `MockFeatureProvider` unconditionally, so
# `default-features = false` fails to compile the SDK itself. The cost is
# `mockall` in the graph of any build that enables `openfeature`. Left visible
# rather than worked around; revisit when the SDK gates them properly.
open-feature = { version = "0.3" }
# Local (in-process) evaluation only: the flag set syncs in the background and
# every read is served from it, which is what the sync `FeatureFlagProvider`
# contract needs. `tls-aws-lc` replaces the default `tls-ring` because Avenra
# standardises on AWS-LC and two crypto providers make rustls panic on first
# use, unable to auto-select one.
open-feature-flagd = { version = "0.2", default-features = false, features = ["in-process", "tls-aws-lc"] }
# Keep the OTel family on the datadog-opentelemetry-compatible line. Advancing
# these alone pulls a duplicate OTel SDK graph.
opentelemetry = "0.32"
opentelemetry-otlp = { version = "=0.32.0", default-features = false }
opentelemetry-proto = { version = "=0.32.0", default-features = false }
opentelemetry_sdk = "0.32"
parking_lot = "0.12"
percent-encoding = "2"
pin-project-lite = "0.2"
prost = "0.14"
prost-types = "0.14"
rand = "0.10"
rcgen = { version = "0.14", default-features = false }
redis = { version = "1", default-features = false, features = ["cluster-async", "script", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rstest = { version = "0.27", default-features = false }
rtnetlink = "0.23"
# rusqlite 0.40 and sqlx-sqlite 0.9 require incompatible libsqlite3-sys
# versions, which cannot coexist because both link the native SQLite library.
rusqlite = { version = "0.39", features = ["bundled", "trace"] }
rustls = { version = "0.23.46", default-features = false }
