[workspace.package]
version = "0.8.0"
edition = "2024"
# Minimum supported Rust version (MSRV) floor. Cargo refuses to build on any
# toolchain below this, giving a clear "requires rustc >= X" error instead of a
# confusing downstream compile failure. It must reflect the versions the code
# actually compiles on: clippy is MSRV-aware and its default-warn
# `incompatible_msrv` lint (a hard error under `-D warnings`) fires when workspace
# code calls a std API stabilized *after* this floor, so a floor set below the
# real minimum is not just cosmetic — it breaks CI. We keep the floor equal to
# the pinned toolchain in rust-toolchain.toml (the version we build and validate
# on): that is the minimum we can prove green. Raise both together when bumping.
# Edition 2024 independently requires >=1.85. Members inherit via
# `rust-version.workspace = true`.
rust-version = "1.97"
authors = ["Avenra contributors"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
aead-stream = "0.6"
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
aes-gcm = "0.11"
aws-config = { version = "1", default-features = false }
aws-credential-types = "1"
aws-lc-rs = { version = "1.17", default-features = false, features = ["aws-lc-sys"] }
aws-sdk-acmpca = { version = "1", default-features = false }
aws-sdk-ecr = { version = "1", default-features = false }
aws-sdk-s3 = { version = "1", default-features = false }
aws-sdk-secretsmanager = { version = "1", default-features = false }
aws-sigv4 = { version = "1", default-features = false }
aws-smithy-async = "1"
aws-smithy-http-client = { version = "1", default-features = false }
aws-smithy-runtime-api = "1"
# aws-config 1.12 still uses aws-smithy-json 0.63, which does not compile with
# aws-smithy-types 1.7. Keep the AWS SDK graph on its latest coherent line.
aws-smithy-types = "=1.6.3"
# 0.63 requires the currently incompatible aws-smithy-types 1.7 line above.
aws-smithy-xml = "0.62"
aws-types = "1"
axum = "0.8"
base64 = "0.23"
bcrypt = "0.19"
bytes = "1"
bytesize = "2.3.1"
clap = "4"
comfy-table = "8"
datadog-opentelemetry = "0.5"
dashmap = "6"
deadpool-redis = { version = "0.23", default-features = false, features = ["rt_tokio_1", "script", "tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
# Eppo hard-enables reqwest 0.12's ring-backed `rustls-tls` feature. Keep that
# transitive exception isolated; remove it when Eppo exposes an AWS-LC or
# provider-neutral TLS feature.
eppo = "5.2.1"
futures-core = "0.3"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["metrics", "tokio", "tls-aws-lc-rs", "webpki-roots"] }
