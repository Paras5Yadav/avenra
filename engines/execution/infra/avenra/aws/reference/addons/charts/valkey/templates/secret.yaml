# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The password lives in the config file rather than on the command line, where
  # anything that can list the node's processes would see it.
  valkey.conf: |
    requirepass {{ required "password is required" .Values.password }}
    # In memory only: nothing Avenra keeps here needs to survive a restart.
    save ""
    appendonly no
    maxmemory {{ .Values.maxmemory }}
    maxmemory-policy {{ .Values.maxmemoryPolicy }}
  VALKEY_PASSWORD: {{ .Values.password | quote }}
  # The variable Avenra's API reads its rate limiters' store from.
  AVENRA_REDIS_URL: {{ printf "redis://:%s@%s.%s.svc.cluster.local:%v" .Values.password .Release.Name .Release.Namespace 6379 | quote }}
