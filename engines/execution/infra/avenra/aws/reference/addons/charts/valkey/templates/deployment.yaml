apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Two instances would split the counters between them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "valkey.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "valkey.labels" . | nindent 8 }}
      annotations:
        # Valkey reads its config only at start.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        # The image's valkey user.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ required "image is required" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          env:
            # valkey-cli authenticates from this, for the probe and for
            # anyone who execs in.
            - name: VALKEYCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: VALKEY_PASSWORD
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            {{- include "valkey.ready" . | nindent 12 }}
            periodSeconds: 5
          livenessProbe:
            {{- include "valkey.ready" . | nindent 12 }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Release.Name }}
            items:
              - key: valkey.conf
                path: valkey.conf
        - name: data
          emptyDir: {}
