apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgresql.labels" . | nindent 8 }}
      annotations:
        # The container reads the Secret through env, which only a restart
        # picks up.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Enough for a clean shutdown checkpoint, so a restart doesn't replay WAL.
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        # The image's postgres user. fsGroup makes the fresh volume writable
        # by it without running the entrypoint as root.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ required "image is required" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB, which the image's
          # entrypoint reads at first start.
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}
          env:
            # A subdirectory, because a fresh ext4 volume's root holds
            # lost+found and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            {{- include "postgresql.ready" . | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            {{- include "postgresql.ready" . | nindent 12 }}
            periodSeconds: 10
          livenessProbe:
            {{- include "postgresql.ready" . | nindent 12 }}
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ include "postgresql.storageClassName" . }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
