# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
# The keys Avenra's services read from secret/avenra-postgres in the Kind
# harness, so a Avenra deployed here would find them unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ required "credentials.password is required" .Values.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.credentials.database | quote }}
  # In-cluster traffic only; the Service isn't exposed outside the cluster.
  POSTGRES_CONNECTION_STRING: {{ printf "postgres://%s:%s@%s.%s.svc.cluster.local:%v/%s?sslmode=disable" .Values.credentials.user .Values.credentials.password .Release.Name .Release.Namespace 5432 .Values.credentials.database | quote }}
