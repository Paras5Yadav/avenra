# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "serviceAccount.name is required" .Values.serviceAccount.name }}
  namespace: {{ include "avenra-secrets-bootstrap.namespace" . }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
    # The SecretStore authenticates as this ServiceAccount, so it belongs to the
    # same set and moves with it. Helm deletes objects that drop out of a
    # release's manifest; deleting this one breaks secret syncing.
    helm.sh/resource-policy: keep
