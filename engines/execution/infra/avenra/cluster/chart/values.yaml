# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
# Defaults of the `space` release: the control plane and the worker node
# services. The `avenra-builder` release adds values-builder.yaml before the
# caller's values file (install.sh). Values here only switch Kind-only parts of
# the subcharts off; everything the cluster supplies (images, Secrets,
# endpoints, telemetry) comes from the caller's file, and templates/validate.yaml
# fails the render when it is missing (README.md).

# worker or builder. Every node subchart's node.role must match.
role: worker

controlPlane:
  enabled: true
nodeServices:
  enabled: true
buildManager:
  enabled: false

avenra-api-local:
  # install.sh runs the avenra-db-migrate Job from this chart before the
  # release, as bootstrap.sh does; a Job owned by the release could not be
  # replaced on the next upgrade (its pod template is immutable).
  migrate:
    enabled: false
  # The caller creates avenra-internal, avenra-route-signing and
  # avenra-route-verification; the subchart's are development values.
  secrets:
    create: false
  entry:
    type: ClusterIP
  ecwHosts: ""
  # This installer provisions no Redis, so the rate limiters' store is off
  # unless the caller names one (values.example.yaml): an unset URL renders no
  # AVENRA_REDIS_URL and both limiters fail open, as they did before Kind turned
  # its store on. templates/validate.yaml refuses the Kind endpoint and a
  # URL that differs from avenra-cluster-controller-local's.
  redis:
    url: ""

avenra-cluster-controller-local:
  # Shares the API's cluster-activation bucket, so it names the same store.
  redis:
    url: ""

avenra-data-plane-local:
  entry:
    type: ClusterIP
  ecwHosts: ""
