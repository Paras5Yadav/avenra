global:
  scrape_interval: 10s
  scrape_timeout: 3s
otlp:
  translation_strategy: UnderscoreEscapingWithSuffixes
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - service.version
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.pod.name
    - k8s.node.name
  keep_identifying_resource_attributes: true
  promote_scope_metadata: true
storage:
  tsdb:
    out_of_order_time_window: 1m
scrape_configs:
  - job_name: collector
    static_configs:
      - targets: [collector:8888]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
