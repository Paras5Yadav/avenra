# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
{{- /* Kind's development tokens and route-signing key. secrets.create false
       leaves the three Secrets to the caller (infra/avenra/cluster). */ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.internal.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: avenra-api
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  AVENRA_INTERNAL_TOKEN: {{ .Values.internal.internalToken | quote }}
  AVENRA_INTERNAL_CONTROL_TOKEN: {{ .Values.internal.controlToken | quote }}
  AVENRA_PUBLIC_CURSOR_SECRET: {{ .Values.internal.publicCursorSecret | quote }}
  ecw-credential-key: {{ .Values.internal.ecwCredentialKey | quote }}
{{- with .Values.eppo.sdkKey }}
  EPPO_SDK_KEY: {{ . | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.avenraApiRouteToken.ed25519.signingSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  signing-key.pem: {{ .Values.avenraApiRouteToken.ed25519.signingKey | quote }}
  AVENRA_API_ROUTE_ED25519_SIGNING_KEY_ID: {{ .Values.avenraApiRouteToken.ed25519.signingKeyId | quote }}
  AVENRA_API_ROUTE_ED25519_ISSUER: {{ .Values.avenraApiRouteToken.ed25519.issuer | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.avenraApiRouteToken.ed25519.verificationSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  verification-bundle.json: {{ .Values.avenraApiRouteToken.ed25519.verificationBundle | quote }}
{{- end }}
