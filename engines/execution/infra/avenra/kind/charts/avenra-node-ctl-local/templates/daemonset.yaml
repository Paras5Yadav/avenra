# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
{{- $ctx := dict "ctx" . "component" "node-ctl" -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "avenra-node-service.name" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "avenra-node-service.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "avenra-node-service.selectorLabels" $ctx | nindent 6 }}
  # Surge: node-ctl holds /avenra/run/node-ctl/service.mutex with its health
  # socket bound from start, so the successor waits passively
  # (crates/libs/node/ctl/server/src/lib.rs).
  {{- include "avenra-node-service.updateStrategy" (dict "strategy" "surge") | nindent 2 }}
  template:
    metadata:
      annotations:
        {{- include "avenra-node-service.podAnnotations" $ctx | nindent 8 }}
      labels:
        {{- include "avenra-node-service.labels" $ctx | nindent 8 }}
    spec:
      {{- include "avenra-node-service.nodeSelector" $ctx | nindent 6 }}
      {{- include "avenra-node-service.priorityClass" $ctx | nindent 6 }}
      # The Kubernetes node-local controller authenticates with this
      # ServiceAccount's token (rbac.yaml, fenced by node-fence.yaml); it
      # activates because AVENRA_K8S_NODE_NAME is set
      # (crates/libs/node/ctl/server/src/kubernetes_controller/mod.rs).
      serviceAccountName: {{ include "avenra-node-service.name" $ctx }}
      # Host network: node-ctl publishes node state, a node-bound ClusterApi
      # RPC (see avenra-node-service.nodeBoundNetwork).
      {{- include "avenra-node-service.nodeBoundNetwork" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | int }}
      securityContext:
        {{- include "avenra-node-service.runAs" (dict "ctx" . "user" "AVENRA_NODECTL" "groups" "AVENRA_NODECTL_GROUPS") | nindent 8 }}
      initContainers:
        # node-api, sandbox-manager and template-manager reach the socket
        # through avenra-nodectlclients (crates/libs/node/ctl/server/src/lib.rs).
        {{- include "avenra-node-service.prepareRunDir" (dict "ctx" . "path" "/avenra/run/node-ctl" "mode" "0750"
            "uid" (include "avenra-node-service.identityNumber" (dict "ctx" . "name" "AVENRA_NODECTL_UID"))
            "gid" (include "avenra-node-service.groupId" (dict "ctx" . "name" "avenra-nodectlclients"))) | nindent 8 }}
      containers:
        - name: node-ctl
          {{- include "avenra-node-service.image" . | nindent 10 }}
          command:
            - /opt/avenra/bin/avenra-nodectl-svc
            - --health-socket={{ include "avenra-node-service.healthSocket" $ctx }}
          {{- include "avenra-node-service.restrictedContainer" . | nindent 10 }}
          env:
            {{- include "avenra-node-service.env.identity" . | nindent 12 }}
            {{- include "avenra-node-service.env.clusterApi" . | nindent 12 }}
          {{- include "avenra-node-service.probes" $ctx | nindent 10 }}
          volumeMounts:
            {{- include "avenra-node-service.mount.run" . | nindent 12 }}
            {{- include "avenra-node-service.mount.clusterApiToken" . | nindent 12 }}
            {{- include "avenra-node-service.mount.rpcCa" . | nindent 12 }}
            {{- include "avenra-node-service.mount.private" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "avenra-node-service.volume.run" . | nindent 8 }}
        {{- include "avenra-node-service.volume.clusterApiToken" . | nindent 8 }}
        {{- include "avenra-node-service.volume.rpcCa" . | nindent 8 }}
        {{- include "avenra-node-service.volume.private" . | nindent 8 }}
