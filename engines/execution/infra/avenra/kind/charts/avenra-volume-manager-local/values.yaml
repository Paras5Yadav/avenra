# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
# volume-manager on every Avenra Kind node: snapshot and template transfers
# between /avenra/cache and the object store. One release per role: `space`
# and `avenra-builder` (`--set node.role=builder`).

image:
  repository: avenra-worker
  tag: local
  pullPolicy: IfNotPresent

datadogEnvironment: kind-local
clusterId: kind-local
telemetry: {}
node: {}

# On SIGTERM volume-manager closes transfer admission, drains queued
# transfers for up to --drain-timeout-secs (100 s), then stops its gRPC server
# within --server-drain-timeout-secs (10 s)
# (crates/libs/vol/mgr/server/src/run.rs). The grace covers both plus exit.
terminationGracePeriodSeconds: 120

# Volume-manager's streaming snapshot upload part budget
# (AVENRA_VOLUME_STREAM_PUSH_BUFFER_BUDGET_BYTES). Null leaves the variable
# unset, so Kind streams eligible uploads with the service default 1 GiB
# budget, as a deployment that does not set it does: this pod has no memory
# limit shared with other services. "0" uploads through temporary files
# instead; another value must be whole MiB and at least 64 MiB. See
# docs/snapshot-upload-streaming.md.
streamPushBufferBudgetBytes: null

# Kind sizing: requests only (see avenra-node-manager-local/values.yaml).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
