# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
apiVersion: v1
kind: Secret
metadata:
  name: avenra-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: avenra-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.credentials.database | quote }}
  AVENRA_DB_MASTER_USER: {{ .Values.credentials.masterUser | quote }}
  AVENRA_DB_MASTER_PASSWORD: {{ .Values.credentials.masterPassword | quote }}
  # The master user over TLS, as deployed: sslmode=require encrypts without
  # verifying the server, so the pod's self-signed certificate is enough.
  POSTGRES_CONNECTION_STRING: "postgres://{{ .Values.credentials.masterUser }}:{{ .Values.credentials.masterPassword }}@{{ .Values.service.name }}:{{ .Values.service.port }}/{{ .Values.credentials.database }}?sslmode=require"
