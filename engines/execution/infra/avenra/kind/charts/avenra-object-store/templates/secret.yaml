# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
apiVersion: v1
kind: Secret
metadata:
  name: avenra-object-store
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: avenra-object-store
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Consumed by volume-manager as static S3 credentials (local-dev escape hatch
  # that bypasses credmgr's STS/IRSA exchange — see
  # crates/libs/vol/mgr/server/src/run.rs), and by the gateway as its root
  # account (ROOT_ACCESS_KEY / ROOT_SECRET_KEY), so sigv4-signed requests from
  # vol-mgr are actually validated (not anonymous).
  AVENRA_OBJECT_STORE_STATIC_ACCESS_KEY_ID: {{ .Values.credentials.accessKey | quote }}
  AVENRA_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY: {{ .Values.credentials.secretKey | quote }}
