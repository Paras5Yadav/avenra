# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
{{- $ctx := dict "ctx" . "component" "template-manager" -}}
{{- include "avenra-node-service.serviceAccount" $ctx }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "avenra-node-service.name" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "avenra-node-service.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "avenra-node-service.selectorLabels" $ctx | nindent 6 }}
  # Surge: template-manager holds /avenra/run/template-manager/service.mutex
  # and its successor waits passively for it
  # (crates/libs/template/mgr/src/run.rs).
  {{- include "avenra-node-service.updateStrategy" (dict "strategy" "surge") | nindent 2 }}
  template:
    metadata:
      annotations:
        {{- include "avenra-node-service.podAnnotations" $ctx | nindent 8 }}
      labels:
        {{- include "avenra-node-service.labels" $ctx | nindent 8 }}
    spec:
      {{- include "avenra-node-service.nodeSelector" $ctx | nindent 6 }}
      {{- include "avenra-node-service.priorityClass" $ctx | nindent 6 }}
      serviceAccountName: {{ include "avenra-node-service.name" $ctx }}
      # The ClusterApi token is projected below; no Kubernetes API access.
      automountServiceAccountToken: false
      # Host network: template-manager makes no node-bound ClusterApi call,
      # but its template-release reads (FindTemplateRelease,
      # FindTemplateReleaseByHash, ListLatestTemplateReleases,
      # crates/libs/template/mgr/src/volume.rs) are scoped to the node whose
      # registered address is the caller's source address once ClusterApi
      # authenticates by TokenReview (template_read_scope,
      # crates/libs/internal/api/server/src/adapter.rs). From a pod IP only
      # generic releases would resolve, never an org's private ones.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | int }}
      # avenra-tmplmgr with AVENRA_TEMPLATE_MANAGER_GROUPS. Privileged btrfs
      # work is delegated to node-manager over its socket
      # (crates/libs/template/mgr/src/btrfs_via_nodemgr.rs).
      securityContext:
        {{- include "avenra-node-service.runAs" (dict "ctx" . "user" "AVENRA_TMPLMGR" "groups" "AVENRA_TEMPLATE_MANAGER_GROUPS") | nindent 8 }}
      containers:
        - name: template-manager
          {{- include "avenra-node-service.image" . | nindent 10 }}
          command:
            - /opt/avenra/bin/avenra-tmplmgr-svc
            - --health-socket={{ include "avenra-node-service.healthSocket" $ctx }}
          {{- include "avenra-node-service.restrictedContainer" . | nindent 10 }}
          env:
            {{- with .Values.rootfsBackingPolicy }}
            {{- if not (has . (list "inherit" "nocow")) }}
            {{- fail "rootfsBackingPolicy must be inherit, nocow, or empty" }}
            {{- end }}
            - name: AVENRA_TEMPLATE_ROOTFS_BACKING_POLICY
              value: {{ . | quote }}
            {{- end }}
            {{- include "avenra-node-service.env.identity" . | nindent 12 }}
            {{- include "avenra-node-service.env.clusterApi" . | nindent 12 }}
            {{- with .Values.templateCache }}
            {{- with .budgetBytes }}
            - name: AVENRA_TEMPLATE_CACHE_BUDGET_BYTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .gcIntervalSecs }}
            - name: AVENRA_TEMPLATE_GC_INTERVAL_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .gcGraceSecs }}
            - name: AVENRA_TEMPLATE_GC_GRACE_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .prefetchLatestN }}
            # How many release digests per warmed template prefetch pins;
            # pinned bytes count toward the budget and are never reclaimed.
            - name: AVENRA_TEMPLATE_PREFETCH_LATEST_N
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- include "avenra-node-service.probes" $ctx | nindent 10 }}
          volumeMounts:
            {{- include "avenra-node-service.mount.run" . | nindent 12 }}
            {{- include "avenra-node-service.mount.cache" (dict) | nindent 12 }}
            {{- include "avenra-node-service.mount.clusterApiToken" . | nindent 12 }}
            {{- include "avenra-node-service.mount.rpcCa" . | nindent 12 }}
            {{- include "avenra-node-service.mount.private" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "avenra-node-service.volume.run" . | nindent 8 }}
        {{- include "avenra-node-service.volume.cache" . | nindent 8 }}
        {{- include "avenra-node-service.volume.clusterApiToken" . | nindent 8 }}
        {{- include "avenra-node-service.volume.rpcCa" . | nindent 8 }}
        {{- include "avenra-node-service.volume.private" . | nindent 8 }}
