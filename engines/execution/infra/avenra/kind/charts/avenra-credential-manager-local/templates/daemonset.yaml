# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
{{- $ctx := dict "ctx" . "component" "credential-manager" -}}
{{- include "avenra-node-service.serviceAccount" $ctx }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "avenra-node-service.name" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "avenra-node-service.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "avenra-node-service.selectorLabels" $ctx | nindent 6 }}
  # Surge: credential-manager holds /avenra/run/credential-manager/service.mutex
  # and its successor waits passively for it
  # (crates/libs/credential/mgr/server/src/run.rs).
  {{- include "avenra-node-service.updateStrategy" (dict "strategy" "surge") | nindent 2 }}
  template:
    metadata:
      annotations:
        {{- include "avenra-node-service.podAnnotations" $ctx | nindent 8 }}
      labels:
        {{- include "avenra-node-service.labels" $ctx | nindent 8 }}
    spec:
      {{- include "avenra-node-service.nodeSelector" $ctx | nindent 6 }}
      {{- include "avenra-node-service.priorityClass" $ctx | nindent 6 }}
      serviceAccountName: {{ include "avenra-node-service.name" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | int }}
      # avenra-sbxmgr (UID 950) with AVENRA_CREDENTIAL_MANAGER_GROUPS, the
      # identity its volume-socket preflight pins
      # (crates/libs/credential/mgr/server/src/run/volume_socket.rs). No host
      # PID namespace: its optional peer-process check
      # (AVENRA_UDS_PEER_PROCESS_CHECK) defaults to off.
      securityContext:
        {{- include "avenra-node-service.runAs" (dict "ctx" . "user" "AVENRA_SBXMGR" "groups" "AVENRA_CREDENTIAL_MANAGER_GROUPS") | nindent 8 }}
      initContainers:
        # The volume-socket directory: owned by credential-manager's identity,
        # group avenra-volcredclients, mode 0750, exactly what the listener's
        # preflight requires before it binds there
        # (crates/libs/credential/mgr/server/src/run/volume_socket.rs).
        # volume-manager, which runs as avenra-volmgr, reaches the socket
        # through that group (docs/installation.md).
        {{- include "avenra-node-service.prepareRunDir" (dict "ctx" . "path" "/avenra/run/volume-credentials" "mode" "0750"
            "uid" (include "avenra-node-service.identityNumber" (dict "ctx" . "name" "AVENRA_SBXMGR_UID"))
            "gid" (include "avenra-node-service.groupId" (dict "ctx" . "name" "avenra-volcredclients"))) | nindent 8 }}
      containers:
        - name: credential-manager
          {{- include "avenra-node-service.image" . | nindent 10 }}
          # The node credential agent: it binds the node-local sockets under
          # the service mutex and forwards every RPC to the control-plane
          # authority, holding no database, KEK or AWS credential itself
          # (run_agent, crates/libs/credential/mgr/server/src/run.rs;
          # node_service.rs).
          command:
            - /opt/avenra/bin/avenra-credmgr-svc
            - --role=agent
            - --health-socket={{ include "avenra-node-service.healthSocket" $ctx }}
            # The listener for the volume-manager identity: ExchangeToken,
            # IssueDek and UnwrapDek only; the standard socket keeps serving
            # sandbox-manager and template-manager.
            - --volume-socket=/avenra/run/volume-credentials/credmgr.sock
          {{- include "avenra-node-service.restrictedContainer" . | nindent 10 }}
          env:
            {{- include "avenra-node-service.env.identity" . | nindent 12 }}
            {{- include "avenra-node-service.env.credmgrAuthority" . | nindent 12 }}
            # A node credential-manager started without --role=agent would be
            # a keyless authority that reports Ready and fails every crypto
            # call; this makes that misconfiguration exit instead (run.rs).
            - name: AVENRA_CREDMGR_FAIL_ON_KEYLESS_AUTHORITY
              value: "true"
          {{- include "avenra-node-service.probes" $ctx | nindent 10 }}
          volumeMounts:
            {{- include "avenra-node-service.mount.run" . | nindent 12 }}
            {{- include "avenra-node-service.mount.private" . | nindent 12 }}
            {{- include "avenra-node-service.mount.credmgrToken" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "avenra-node-service.volume.run" . | nindent 8 }}
        {{- include "avenra-node-service.volume.private" . | nindent 8 }}
        {{- include "avenra-node-service.volume.credmgrToken" . | nindent 8 }}
