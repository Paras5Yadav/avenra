{{- if .Values.fakeintake.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: datadog-fakeintake
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datadog-agent-local.fakeintakeLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: datadog-fakeintake
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{{- end }}
