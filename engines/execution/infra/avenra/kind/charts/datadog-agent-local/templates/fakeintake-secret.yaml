{{- if .Values.fakeintake.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: datadog-fakeintake-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datadog-agent-local.fakeintakeLabels" . | nindent 4 }}
type: Opaque
data:
  # Fake Intake accepts any API key. This is intentionally a public test-only
  # value so the local comparison path never needs a Datadog credential.
  api-key: {{ "00000000000000000000000000000000" | b64enc | quote }}
{{- end }}
