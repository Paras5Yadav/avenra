# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-build-mgr-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avenra-buildmgr-svc"
path = "src/main.rs"

[features]
default = ["aws-ecr"]
k8s = ["avenra-runtime-build-mgr-server/k8s"]
aws-ecr = ["avenra-runtime-build-mgr-server/aws-ecr"]
otel = [
    "avenra-runtime-build-mgr-server/otel",
    "avenra-runtime-common-svc/otel",
]
datadog = [
    "otel",
    "avenra-runtime-build-mgr-server/datadog",
    "avenra-runtime-common-svc/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# internal
avenra-runtime-build-mgr-server = { workspace = true }
avenra-runtime-common-svc = { workspace = true }
