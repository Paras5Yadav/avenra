# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-node-api-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avenra-node-api-svc"
path = "src/main.rs"

[features]
default = []
# Opt-in Kubernetes projected-token (TokenReview) auth, which pulls in the kube
# stack. Off by default so the workspace builds without kube for non-k8s
# deployments (dev box, UTM, self-deploy); prod image builds enable it. Forwards
# to `common-svc`'s `k8s` feature.
k8s = ["avenra-runtime-common-svc/k8s", "avenra-runtime-node-api-server/k8s"]
otel = [
    "avenra-runtime-common-svc/otel",
    "avenra-runtime-node-api-server/otel",
]
datadog = [
    "otel",
    "avenra-runtime-common-svc/datadog",
    "avenra-runtime-node-api-server/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# internal
avenra-runtime-common-svc = { workspace = true }
avenra-runtime-node-api-server = { workspace = true }
