# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-node-ctl-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avenra-nodectl-svc"
path = "src/main.rs"

[features]
default = []
otel = [
    "avenra-runtime-common-svc/otel",
    "avenra-runtime-node-ctl-server/otel",
]
datadog = [
    "otel",
    "avenra-runtime-common-svc/datadog",
    "avenra-runtime-node-ctl-server/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
kubernetes = ["avenra-runtime-node-ctl-server/kubernetes"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# internal
avenra-runtime-common-core = { workspace = true }
avenra-runtime-common-svc = { workspace = true }
avenra-runtime-node-ctl-server = { workspace = true }
