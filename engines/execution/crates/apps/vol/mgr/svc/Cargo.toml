# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-volmgr-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avenra-volmgr-svc"
path = "src/main.rs"

[features]
default = []
otel = [
    "avenra-runtime-common-svc/otel",
    "avenra-runtime-volmgr/otel",
]
datadog = [
    "otel",
    "avenra-runtime-common-svc/datadog",
    "avenra-runtime-volmgr/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time"] }
tonic = { workspace = true }

# internal
avenra-runtime-common-core = { workspace = true }
avenra-runtime-common-svc = { workspace = true }
avenra-runtime-credmgr-client = { workspace = true }
avenra-runtime-volmgr = { workspace = true }

[dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }
tower = { workspace = true }
uuid = { workspace = true }
