# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-api-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avenra-api-svc"
path = "src/main.rs"

[features]
default = []
federated-identity = ["avenra-runtime-api/federated-identity"]
otel = [
    "avenra-runtime-common-svc/otel",
    "avenra-runtime-api/otel",
]
datadog = [
    "otel",
    "avenra-runtime-common-svc/datadog",
    "avenra-runtime-api/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
kubernetes = ["avenra-runtime-api/kubernetes"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# internal
avenra-runtime-api = { workspace = true }
avenra-runtime-common-svc = { workspace = true }

# jemalloc on glibc Linux targets — better fragmentation behavior for the
# long-running HTTP service than the system glibc allocator.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { workspace = true }
