# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-mock-llm-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avenra-mock-llm-svc"
path = "src/main.rs"

[features]
default = []
otel = ["avenra-runtime-common-svc/otel"]
datadog = ["otel", "avenra-runtime-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }
tracing = { workspace = true }

# internal
avenra-runtime-common-svc = { workspace = true }
