# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-data-plane-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
otel = [
    "avenra-runtime-common-svc/otel",
    "avenra-runtime-data-plane-server/otel",
]
datadog = [
    "otel",
    "avenra-runtime-common-svc/datadog",
    "avenra-runtime-data-plane-server/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
kubernetes = ["avenra-runtime-data-plane-server/kubernetes"]

[[bin]]
name = "avenra-data-plane-svc"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# internal
avenra-runtime-common-svc = { workspace = true }
avenra-runtime-data-plane-server = { workspace = true }

# jemalloc on glibc Linux targets: multipart uploads buffer whole request
# bodies, and glibc arenas keep the peak of each upload burst resident.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
avenra-runtime-test-env = { workspace = true }
