# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-avenrad-host-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avenrad-host"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

# internal
avenra-runtime-common-cli = { workspace = true }
avenra-runtime-common-core = { workspace = true }
avenra-runtime-avenrad-host-client = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["fs", "user"] }
avenra-runtime-avenrad-guest-server = { workspace = true }
avenra-runtime-avenrad-host-server = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio-util = { workspace = true }
