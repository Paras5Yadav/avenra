# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-avenrad-guest-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avenrad-svc"
path = "src/main.rs"

[features]
default = []
otel = ["avenra-runtime-avenrad-guest-server/otel"]
datadog = ["otel", "avenra-runtime-avenrad-guest-server/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Compiles in the test-only environment hooks; never enabled for release builds.
test-hooks = ["avenra-runtime-avenrad-guest-server/test-hooks"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# internal
avenra-runtime-avenrad-guest-server = { workspace = true, features = ["service-entrypoint"] }
