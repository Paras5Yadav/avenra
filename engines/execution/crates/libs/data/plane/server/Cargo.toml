# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-data-plane-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
otel = ["avenra-runtime-common-svc/otel"]
datadog = ["otel", "avenra-runtime-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
kubernetes = ["avenra-runtime-node-api-client/kubernetes"]

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
multer = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
avenra-runtime-common-core = { workspace = true }
avenra-runtime-common-grpc = { workspace = true, features = ["internal-tls"] }
avenra-runtime-common-svc = { workspace = true }
avenra-runtime-feature-flags = { workspace = true }
avenra-runtime-metrics = { workspace = true }
avenra-runtime-net-gateway-client = { workspace = true }
avenra-runtime-node-api-client = { workspace = true }
avenra-runtime-public-api = { workspace = true, features = ["serde"] }
avenra-runtime-sbx-mgr-client = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
avenra-runtime-test-env = { workspace = true }
aws-lc-rs = { workspace = true }
insta = { workspace = true }
tower = { workspace = true, features = ["util"] }
