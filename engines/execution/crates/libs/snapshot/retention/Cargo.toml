# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-snapshot-retention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
s3 = ["dep:avenra-runtime-snapshot-storage", "avenra-runtime-snapshot-storage/s3"]

[dependencies]
futures-util = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true }

# internal
avenra-runtime-common-core = { workspace = true, features = ["sqlx"] }
avenra-runtime-events = { workspace = true }
avenra-runtime-metrics = { workspace = true }
avenra-runtime-sandbox-portability = { workspace = true }
avenra-runtime-sandbox-store = { workspace = true }
avenra-runtime-snapshot-storage = { workspace = true, optional = true }
avenra-runtime-snapshot-store = { workspace = true }

[dev-dependencies]
avenra-runtime-db-test-fixtures = { workspace = true }
avenra-runtime-metrics = { workspace = true, features = ["test-capture"] }
avenra-runtime-observability = { workspace = true, features = ["test-capture"] }
avenra-runtime-test-env = { workspace = true }
sqlx = { workspace = true, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tracing-subscriber = { workspace = true }
