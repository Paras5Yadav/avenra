[package]
name = "avenra-runtime-db-test-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# This crate only backs tests, so it always enables the test hooks it reads.
avenra-runtime-common-core = { workspace = true, features = ["serde", "sqlx", "test-hooks"] }
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
avenra-runtime-test-env = { workspace = true }
tempfile = { workspace = true }
