# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-volmgr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Forwarded by the binary; the library owns the service body that is traced.
otel = ["avenra-runtime-common-svc/otel"]
datadog = ["otel", "avenra-runtime-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
nix = { workspace = true, features = ["time"] }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
zeroize = { workspace = true }
zstd = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
avenra-runtime-common-core = { workspace = true, features = ["serde", "rusqlite"] }
avenra-runtime-common-io = { workspace = true, features = ["reflink"] }
avenra-runtime-common-jobs = { workspace = true }
avenra-runtime-common-svc = { workspace = true, features = ["sqlite"] }
avenra-runtime-credmgr-client = { workspace = true }
avenra-runtime-metrics = { workspace = true }
avenra-runtime-object-store = { workspace = true }
avenra-runtime-volmgr-client = { workspace = true }
avenra-runtime-node-mgr-client = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
bytes = { workspace = true }
avenra-runtime-common-grpc = { workspace = true }
tonic-health = { workspace = true }
tracing-subscriber = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` so the codec
# admission tests can assert a blocked acquire without real-time sleeps.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
