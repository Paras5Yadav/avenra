# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-credmgr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-hooks = ["avenra-runtime-common-core/test-hooks"]
default = []
otel = ["avenra-runtime-common-svc/otel"]
datadog = ["otel", "avenra-runtime-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
avenra-runtime-common-core = { workspace = true, features = ["serde", "sqlx"] }
aes-gcm = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-credential-types = { workspace = true, features = ["hardcoded-credentials"] }
aws-sdk-acmpca = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-smithy-types = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
http-body = { workspace = true }
sha2 = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# TokenReview client + types. Keep its rustls backend aligned with the
# process-wide AWS-LC provider installed by common service initialization.
k8s-openapi = { workspace = true, features = ["v1_32"] }
kube = { workspace = true, default-features = false, features = ["aws-lc-rs", "client", "config", "rustls-tls", "runtime"] }
lru = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
# Signs gateway CAs and leaves under the node intermediate CA. AWS-LC is the crypto
# backend; `x509-parser` supplies SubjectPublicKeyInfo::from_der and
# Issuer::from_ca_cert_der.
rcgen = { workspace = true, features = ["aws_lc_rs", "pem", "x509-parser"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
subtle = { workspace = true }
thiserror = { workspace = true }
# rcgen states certificate validity in `time::OffsetDateTime`; x509-parser hands
# back unix seconds. Both ends of the leaf path speak these, so nothing here
# routes through jiff.
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true, features = ["tls-aws-lc"] }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# `verify-aws` is what checks a node CSR's self-signature; without it the
# authority would forward a request it never proved was signed by the key
# inside it.
x509-parser = { workspace = true, features = ["verify-aws"] }
zeroize = { workspace = true }

# internal
avenra-runtime-common-grpc = { workspace = true }
avenra-runtime-common-svc = { workspace = true, features = ["k8s"] }
avenra-runtime-credential-injection-core = { workspace = true }
avenra-runtime-credential-injection-store = { workspace = true }
avenra-runtime-credential-provider-client = { workspace = true }
avenra-runtime-credmgr-client = { workspace = true }
avenra-runtime-metrics = { workspace = true }
avenra-runtime-net-common = { workspace = true }

[dev-dependencies]
avenra-runtime-common-core = { workspace = true, features = ["serde", "sqlx", "test-hooks"] }
aws-smithy-runtime-api = { workspace = true, features = ["client"] }
insta = { workspace = true }
avenra-runtime-common-grpc = { workspace = true, features = ["test-support"] }
nix = { workspace = true, features = ["user", "fs"] }
avenra-runtime-db-test-fixtures = { workspace = true }
avenra-runtime-metrics = { workspace = true, features = ["test-capture"] }
avenra-runtime-test-env = { workspace = true }
prost-types = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tonic-health = { workspace = true }
tonic-prost = { workspace = true }
