# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-node-runtime-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Read published kernels from S3 or an S3-compatible store.
s3 = ["dep:aws-sdk-s3", "dep:avenra-runtime-s3-http-client"]
# Read Firecracker release archives from GitHub releases.
github = ["dep:reqwest"]
otel = ["avenra-runtime-common-svc/otel"]
datadog = ["otel", "avenra-runtime-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
async-trait = { workspace = true }
aws-sdk-s3 = { workspace = true, optional = true, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio"] }
bytes = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
libc = { workspace = true }
md-5 = { workspace = true }
nix = { workspace = true, features = ["user"] }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
thiserror = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
avenra-runtime-common-core = { workspace = true, features = ["rusqlite", "serde"] }
avenra-runtime-common-jobs = { workspace = true }
avenra-runtime-common-svc = { workspace = true, features = ["sqlite"] }
avenra-runtime-execution-common = { workspace = true }
avenra-runtime-node-mgr-client = { workspace = true }
avenra-runtime-node-runtime-core = { workspace = true, features = ["artifact-store"] }
avenra-runtime-node-runtime-manager-client = { workspace = true }
avenra-runtime-s3-http-client = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
