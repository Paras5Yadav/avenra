# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
[package]
name = "avenra-runtime-node-runtime-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
otel = ["avenra-runtime-common-svc/otel"]
datadog = ["otel", "avenra-runtime-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
dashmap = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["process", "signal", "fs", "user"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
avenra-runtime-common-core = { workspace = true }
avenra-runtime-common-svc = { workspace = true }
avenra-runtime-node-runtime-core = { workspace = true, features = ["host-runtime"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
