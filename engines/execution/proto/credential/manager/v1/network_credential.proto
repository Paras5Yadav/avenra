syntax = "proto3";
package space.credential.manager.v1;

// Kept apart from credential_manager.proto so Network Gateway and the
// host-control API can share this message without the CredentialManager
// service.

// Secret-bearing material for one registered reference in an exact committed
// network policy. Request matching remains exclusively owned by that policy;
// this value is joined to it by credential_reference_id in Network Gateway.
// This message is transport-only: callers must immediately move the value
// into redacted, zeroizing types.
message ResolvedNetworkCredential {
  string credential_reference_id = 1;
  bytes value = 2;
}
