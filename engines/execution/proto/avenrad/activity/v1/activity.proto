syntax = "proto3";
package space.avenrad.activity.v1;

import "google/protobuf/duration.proto";

message SetActivityStateRequest {
  ActivityState state = 1;
}

message Accepted {}

message Denied {
  string reason = 1;
}

message ActiveForAccepted {
  optional google.protobuf.Duration granted_for = 1;
}

message SetActivityStateResponse {
  oneof outcome {
    Accepted accepted = 1;
    Denied denied = 2;
  }
}

message RequestActiveForRequest {
  google.protobuf.Duration hold_for = 1;
}

message RequestActiveForResponse {
  oneof outcome {
    ActiveForAccepted accepted = 1;
    Denied denied = 2;
  }
}

message RequestShutdownRequest {
  optional string reason = 1;
}

message RequestShutdownResponse {
  oneof outcome {
    Accepted accepted = 1;
    Denied denied = 2;
  }
}

enum ActivityState {
  ACTIVITY_STATE_UNSPECIFIED = 0;
  ACTIVITY_STATE_IDLE = 1;
  ACTIVITY_STATE_ACTIVE = 2;
}
