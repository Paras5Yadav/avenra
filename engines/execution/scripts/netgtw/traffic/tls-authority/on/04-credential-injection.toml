name = "Credential injection reaches the exact inspected TLS origin"

[[steps]]
policy = { default = "deny", allow = ["198.18.1.2"], tls_interception = "on", credential = { exact_host = "allowed.127-0-0-1.dev", ports = [443, 8443], path_prefix = "/echo", methods = ["POST"], header_name = "authorization" } }
probes = [
  { kind = "tls", host = "allowed.127-0-0-1.dev", expect = "allow", preserve_headers = { authorization = "Bearer guest-value" }, expect_credential = "authorization" },
  { kind = "http2", host = "allowed.127-0-0-1.dev", expect = "allow", preserve_headers = { authorization = "Bearer guest-value" }, expect_credential = "authorization" },
]
