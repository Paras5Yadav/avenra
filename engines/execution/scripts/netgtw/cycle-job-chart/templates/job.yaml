# Modified for Avenra. Original attribution and adaptation record: LICENSES/.
# The Job cleans itself up even if the rendering script dies:
# activeDeadlineSeconds kills a wedged run after 1h, ttlSecondsAfterFinished
# has the cluster delete the finished Job within 1h, and backoffLimit 0 keeps
# a failed batch from re-running.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: netgtw-cycle-fleet
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netgtw-cycle-fleet
    spec:
      restartPolicy: Never
      {{- /* Pinning via nodeName bypasses the scheduler and NoSchedule
      taints, same as `kubectl debug node/`. */}}
      nodeName: {{ required "node is required" .Values.node }}
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: cycle
          image: {{ .Values.image }}
          {{- /* :latest defaults to Always — a registry roundtrip per node
          per sweep for an image whose only job is providing chroot. */}}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
          {{- /* Host root at /host so the node's own CLI binary runs against
          the host socket as uid 0 — CycleNetGateway rejects the
          sandbox-manager pod's service user by design. */}}
          command:
            - chroot
            - /host
            - /avenra/bin/avenra-sbxmgr
            - cycle-net-gateway
            - --execute
            {{- range .Values.cliArgs }}
            - {{ . | quote }}
            {{- end }}
      volumes:
        - name: host-root
          hostPath:
            path: /
